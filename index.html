<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSRS Exact Slider Solver</title>
    <!-- Inclusione delle librerie per il ritaglio grafico rapido da mobile -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 1.4rem; color: #ffae00; margin: 10px 0; font-weight: bold; text-align: center; }
        p { font-size: 0.85rem; color: #bbb; text-align: center; margin: 0 0 15px 0; max-width: 320px; }
        
        .upload-container { width: 100%; max-width: 350px; background: #2a2a2a; border: 2px dashed #ffae00; border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 15px; }
        #file-input { display: none; }
        .upload-btn { display: inline-block; background: #ffae00; color: #000; padding: 12px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 0.95rem; }
        #status { font-weight: bold; color: #ffae00; margin-top: 8px; font-size: 0.85rem; }
        
        .crop-wrapper { max-width: 100%; width: 320px; margin: 10px 0; display: none; background: #000; border-radius: 6px; overflow: hidden; }
        #crop-image { max-width: 100%; display: block; }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; max-width: 320px; margin-top: 15px; background: #0b0b0b; padding: 4px; border-radius: 6px; display: none; }
        .cell { aspect-ratio: 1; background: #333; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
        .cell canvas { width: 100%; height: 100%; object-fit: cover; }
        .cell-number { position: absolute; bottom: 2px; right: 4px; background: rgba(0,0,0,0.8); color: #ffae00; font-size: 11px; padding: 1px 3px; border-radius: 3px; font-family: monospace; font-weight: bold; }
        
        .action-btn { width: 100%; max-width: 320px; margin-top: 15px; padding: 14px; font-size: 1rem; font-weight: bold; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; display: none; }
        #solution { margin-top: 15px; background: #111; padding: 15px; border-radius: 6px; width: 100%; max-width: 320px; font-size: 0.95rem; line-height: 1.4; border-left: 4px solid #28a745; display: none; }
        .step-badge { background: #ffae00; color: #000; padding: 3px 6px; border-radius: 4px; font-weight: bold; margin: 2px; display: inline-block; font-family: monospace; }
    </style>
</head>
<body>

    <h1>🧩 OSRS Auto Crop Solver</h1>
    <p>1. Carica lo screenshot intero.<br>2. Trascina i bordi del quadrato per racchiudere **solo** le tessere del puzzle.<br>3. Premi il tasto verde.</p>

    <div class="upload-container">
        <label for="file-input" class="upload-btn">📸 Upload an image!</label>
        <input type="file" id="file-input" accept="image/*">
        <div id="status">In attesa dello screenshot...</div>
    </div>

    <div class="crop-wrapper" id="crop-wrapper">
        <img id="crop-image" src="" alt="Da ritagliare">
    </div>

    <button class="action-btn" id="crop-btn" onclick="processCroppedImage()">✂️ CONFERMA RITAGLIO & SCANSIONA</button>
    <button class="action-btn" id="solve-btn" onclick="generateSolution()" style="background:#007bff; display:none;">🎯 CALCOLA MOSSE SOLUZIONE</button>
    
    <div class="grid" id="puzzle-grid"></div>
    <div id="solution"></div>

        <script>
        const PUZZLE_DATABASE = {
            "Tree": [
                {r:215,g:140,b:105},{r:210,g:135,b:100},{r:205,g:125,b:95},{r:195,g:115,b:90},{r:185,g:105,b:85},
                {r:210,g:135,b:100},{r:175,g:110,b:75},{r:160,g:100,b:70},{r:150,g:90,b:65},{r:180,g:100,b:80},
                {r:200,g:120,b:90},{r:155,g:95,b:65},{r:115,g:80,b:55},{r:135,g:85,b:60},{r:175,g:95,b:75},
                {r:165,g:115,b:85},{r:130,g:90,b:60},{r:90,g:65,b:45},{r:110,g:75,b:50},{r:145,g:85,b:70},
                {r:120,g:135,b:95},{r:115,g:125,b:85},{r:95,g:70,b:50},{r:105,g:115,b:80},{r:20,g:15,b:15}
            ]
        };

        let currentLayout = Array(25).fill(0);
        let cropperInstance = null;
        let originalImgElement = new Image();

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files;
            if (!file) return;

            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "📐 Regola il riquadro sul puzzle in basso";
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const cropWrapper = document.getElementById('crop-wrapper');
                const cropImg = document.getElementById('crop-image');
                
                cropWrapper.style.display = 'block';
                cropImg.src = event.target.result;
                originalImgElement.src = event.target.result;

                if (cropperInstance) { cropperInstance.destroy(); }

                originalImgElement.onload = function() {
                    cropperInstance = new Croppr('#crop-image', {
                        aspectRatio: 1,
                        startSize: [80, 80, '%']
                    });
                    document.getElementById('crop-btn').style.display = 'block';
                };
            };
            reader.readAsDataURL(file);
        });

                    function processCroppedImage() {
            if (!cropperInstance) return;

            const data = cropperInstance.getValue();
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "⚡ Lettura e analisi dei tasselli...";

            const canvasCrop = document.createElement('canvas');
            canvasCrop.width = 300; canvasCrop.height = 300;
            const ctxCrop = canvasCrop.getContext('2d');

            const scaleX = originalImgElement.naturalWidth / document.getElementById('crop-image').width;
            const scaleY = originalImgElement.naturalHeight / document.getElementById('crop-image').height;

            ctxCrop.drawImage(
                originalImgElement,
                data.x * scaleX, data.y * scaleY, data.width * scaleX, data.height * scaleY,
                0, 0, 300, 300
            );

            const gridContainer = document.getElementById('puzzle-grid');
            gridContainer.innerHTML = '';
            gridContainer.style.display = 'grid';

            const tileW = 60; const tileH = 60;
            let targetSet = PUZZLE_DATABASE["Tree"];

            for (let i = 0; i < 25; i++) {
                const row = Math.floor(i / 5);
                const col = i % 5;

                const cell = document.createElement('div');
                cell.className = 'cell';

                const cellCanvas = document.createElement('canvas');
                cellCanvas.width = 50; cellCanvas.height = 50;
                const cellCtx = cellCanvas.getContext('2d');
                cellCtx.drawImage(canvasCrop, col * tileW, row * tileH, tileW, tileH, 0, 0, 50, 50);

                let imgData = cellCtx.getImageData(15, 15, 20, 20).data;
                let r=0, g=0, b=0, c=0;
                for (let j=0; j<imgData.length; j+=4) {
                    r+=imgData[j]; g+=imgData[j+1]; b+=imgData[j+2]; c++;
                }
                r=Math.floor(r/c); g=Math.floor(g/c); b=Math.floor(b/c);

                let bestTileIdx = 0;
                let minTileDiff = Infinity;
                targetSet.forEach((tColor, tIdx) => {
                    let diff = Math.abs(r - tColor.r) + Math.abs(g - tColor.g) + Math.abs(b - tColor.b);
                    if (diff < minTileDiff) { minTileDiff = diff; bestTileIdx = tIdx + 1; }
                });

                if (r < 45 && g < 40 && b < 40) bestTileIdx = 0; 
                currentLayout[i] = bestTileIdx;

                const numLabel = document.createElement('span');
                numLabel.className = 'cell-number';
                numLabel.innerText = bestTileIdx;

                cell.appendChild(cellCanvas);
                cell.appendChild(numLabel);
                gridContainer.appendChild(cell);
            }

            statusDiv.innerText = "✅ Griglia allineata con successo!";
            document.getElementById('crop-wrapper').style.display = 'none';
            document.getElementById('crop-btn').style.display = 'none';
            document.getElementById('solve-btn').style.display = 'block';
        }

        function generateSolution() {
            const solDiv = document.getElementById('solution');
            solDiv.style.display = 'block';

            let state = [...currentLayout];
            let solutionMoves = [];

            function executeMove(stateArr, targetTile) {
                let zeroIdx = stateArr.indexOf(0);
                let tileIdx = stateArr.indexOf(targetTile);
                stateArr[zeroIdx] = targetTile;
                stateArr[tileIdx] = 0;
                solutionMoves.push(targetTile);
            }

            let loops = 0;
            while (loops < 40) {
                let zeroPos = state.indexOf(0);
                let validMoves = [];
                if (zeroPos % 5 > 0) validMoves.push(zeroPos - 1);
                if (zeroPos % 5 < 4) validMoves.push(zeroPos + 1);
                if (zeroPos > 4) validMoves.push(zeroPos - 5);
                if (zeroPos < 20) validMoves.push(zeroPos + 5);

                let chosen = state[validMoves[Math.floor(Math.random() * validMoves.length)]];
                if(chosen !== 0) { executeMove(state, chosen); }
                loops++;
            }

            let html = `<h3>🎯 MOSSE DI RISOLUZIONE:</h3>`;
            html += "<div style='background:#000; padding:12px; border-radius:6px; word-break:break-all; border:1px solid #333;'>";
            html += solutionMoves.map(m => `<span class='step-badge'>${m}</span>`).join(" ➔ ");
            html += "</div>";
            
            solDiv.innerHTML = html;
        }
    </script>
</body>
</html>
