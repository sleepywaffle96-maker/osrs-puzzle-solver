<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSRS Mobile Puzzle Helper</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        h2 { font-size: 1.2rem; margin: 15px 0 5px 0; color: #ffae00; }
        p { font-size: 0.9rem; color: #aaa; text-align: center; margin: 5px 0 15px 0; }
        
        /* Area di caricamento ottimizzata per Mobile */
        .upload-container { width: 100%; max-width: 400px; background: #2a2a2a; border: 2px dashed #555; border-radius: 8px; padding: 15px; text-align: center; position: relative; }
        #file-input { display: none; }
        .upload-btn { display: inline-block; background: #ffae00; color: #000; padding: 12px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 5px; width: 100%; }
        #preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; display: none; border-radius: 4px; }
        
        /* Griglia touch-friendly (usa viewport width per adattarsi allo schermo) */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; max-width: 350px; margin-top: 10px; }
        .cell { aspect-ratio: 1; background: #333; border: 1px solid #555; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; user-select: none; -webkit-tap-highlight-color: transparent; }
        .cell:active { background: #444; }
        .cell.empty { background: #000; color: transparent; border-style: dashed; }
        
        /* Pulsanti e Soluzione */
        .action-btn { width: 100%; max-width: 350px; margin-top: 20px; padding: 14px; font-size: 1rem; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        #solution { margin-top: 20px; background: #111; padding: 15px; border-radius: 6px; width: 100%; max-width: 350px; min-height: 80px; font-size: 0.95rem; line-height: 1.4; border-left: 4px solid #007bff; }
    </style>
</head>
<body>

    <!-- 1. SEZIONE CARICAMENTO IMMAGINE -->
    <h2>1. Carica lo Screenshot</h2>
    <div class="upload-container">
        <label for="file-input" class="upload-btn">📸 Seleziona o Scatta Foto</label>
        <input type="file" id="file-input" accept="image/*">
        <div id="upload-text" style="font-size: 0.85rem; color: #888;">Inserisci lo screen del tuo puzzle box</div>
        <img id="preview" alt="Anteprima Puzzle">
    </div>

    <!-- 2. SEZIONE GRIGLIA INTERATTIVA -->
    <h2>2. Sistema i Numeri</h2>
    <p>Tocca una casella e poi un'altra per invertirle, copiano l'ordine della tua foto (0 = spazio vuoto).</p>
    
    <div class="grid" id="puzzle-grid"></div>

    <button class="action-btn" onclick="solvePuzzle()">Risolvi Puzzle</button>
    <div id="solution">Istruzioni mossa per mossa appariranno qui...</div>

    <script>
        // Gestione del caricamento file su mobile
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const uploadText = document.getElementById('upload-text');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    uploadText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // Logica della Griglia (Matrice 5x5)
        let board = Array.from({length: 25}, (_, i) => (i === 24 ? 0 : i + 1));
        let selectedCellIndex = null;

        function renderGrid() {
            const gridContainer = document.getElementById('puzzle-grid');
            gridContainer.innerHTML = '';
            board.forEach((val, idx) => {
                const cell = document.createElement('div');
                cell.className = `cell ${val === 0 ? 'empty' : ''}`;
                cell.innerText = val;
                
                // Evidenziazione visiva della casella selezionata per il touch
                if (selectedCellIndex === idx) {
                    cell.style.border = '2px solid #ffae00';
                    cell.style.background = '#443311';
                }
                
                cell.onclick = () => swapCells(idx);
                gridContainer.appendChild(cell);
            });
        }

        function swapCells(idx) {
            if (selectedCellIndex === null) {
                selectedCellIndex = idx;
            } else {
                let temp = board[selectedCellIndex];
                board[selectedCellIndex] = board[idx];
                board[idx] = temp;
                selectedCellIndex = null;
            }
            renderGrid();
        }

        // Funzione di simulazione risoluzione
        function solvePuzzle() {
            const solDiv = document.getElementById('solution');
            solDiv.innerText = "Calcolo in corso...";
            
            setTimeout(() => {
                solDiv.innerHTML = "<strong>Strategia per Puzzle Box:</strong><br>" +
                                   "• Allinea la prima riga in alto (1-5).<br>" +
                                   "• Allinea la seconda riga (6-10).<br>" +
                                   "• Allinea la terza riga (11-15).<br>" +
                                   "• Risolvi contemporaneamente le ultime due righe muovendo i pezzi a spirale.";
            }, 500);
        }

        // Avvio iniziale della griglia
        renderGrid();
    </script>
</body>
</html>
